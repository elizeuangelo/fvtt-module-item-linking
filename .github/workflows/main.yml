on:
   push:
      # Sequence of patterns matched against refs/tags
      tags:
         - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Upload Release Assets

jobs:
   build:
      name: Upload Release Asset
      runs-on: ubuntu-latest
      steps:
         - name: Checkout code
           uses: actions/checkout@v4

         - name: Setup Node
           uses: actions/setup-node@v4
           with:
              node-version: 20

         - name: Install Dependencies
           run: npm install

         - name: Pack Compendiums
           run: npm run tools:pack

         - name: Get the version
           id: get_version
           run: |
              echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}
              echo ::set-output name=VERSION_NUMBER::${GITHUB_REF/refs\/tags\/v/}

         #Substitute the Manifest and Download URLs in the module.json
         - name: Substitute Manifest and Download Links For Versioned Ones
           id: sub_manifest_link_version
           uses: microsoft/variable-substitution@v1
           with:
              files: 'module.json'
           env:
              version: ${{ steps.get_version.outputs.VERSION_NUMBER }}

         # Zip Files
         - name: Zip files
           run: zip -r item-linking * -x ".github/*" "assets/*" "tools/*" "package-lock.json" "package.json" "README.md" "LICENSE" "tsconfig.json" ".editorconfig"

         # Create a release for this specific version
         - name: Create Release
           id: create_version_release
           uses: ncipollo/release-action@v1
           with:
              tag: ${{ steps.get_version.outputs.VERSION }}
              name: Release ${{ steps.get_version.outputs.VERSION }}
              draft: false
              prerelease: false
              token: ${{ secrets.GITHUB_TOKEN }}
              artifacts: './module.json,./item-linking.zip'
