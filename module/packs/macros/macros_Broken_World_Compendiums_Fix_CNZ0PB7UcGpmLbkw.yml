name: Broken World Compendiums Fix
type: script
_id: CNZ0PB7UcGpmLbkw
author: SyH1ydCe6TgtPGAR
img: icons/tools/hand/saw-steel-white.webp
scope: global
command: >-
  const worldPacks = game.packs.contents.filter(p => p.metadata.packageType ===
  'world' && p.metadata.type === 'Item');

  const items = (await Promise.all(worldPacks.map(p =>
  p.getDocuments()))).flat();

  items.filter(i => i.flags['item-linking']).forEach(i =>
  i.update({'flags.-=item-linking': null}));
